<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · OpenNoFrp</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='6' fill='%234f8cff'/%3E%3Cpath d='M7 12h9m-4-4 4 4-4 4' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <svg class="logo" viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="6" fill="#4f8cff"/><path d="M7 12h9m-4-4 4 4-4 4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>OpenNoFrp</h1>
    </div>
    <p class="login-sub">内网穿透控制台 · 请使用管理员账号登录</p>

    {{if .Error}}<div class="alert alert-err">{{.Error}}</div>{{end}}

    <form method="post" action="/login">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" placeholder="admin" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit">登 录</button>
    </form>
  </div>
</div>
</body>
</html>
