name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux AMD64
          - goos: linux
            goarch: amd64
            build_client: true
          # Linux ARM64
          - goos: linux
            goarch: arm64
            build_client: true
          # macOS AMD64 (Intel)
          - goos: darwin
            goarch: amd64
            build_client: true
          # macOS ARM64 (Apple Silicon)
          - goos: darwin
            goarch: arm64
            build_client: true
          # Windows AMD64（仅构建服务端）
          - goos: windows
            goarch: amd64
            build_client: false
          - goos: windows
            goarch: arm64
            build_client: false
          - goos: windows
            goarch: '386'
            build_client: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Determine Version
        id: vars
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          else
            TAG="v0.1.0-$(git rev-parse --short HEAD)"
          fi
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      - name: Build Binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          COMMIT="${{ steps.vars.outputs.commit }}"
          DATE="${{ steps.vars.outputs.date }}"
          LDFLAGS="-s -w -X 'opennofrp/pkg/version.Version=${TAG}' -X 'opennofrp/pkg/version.Commit=${COMMIT}' -X 'opennofrp/pkg/version.BuildDate=${DATE}'"

          mkdir -p dist

          # 1. 编译 Server
          SERVER_BIN="opennofrp-server-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            SERVER_BIN="${SERVER_BIN}.exe"
          fi
          echo "Building ${SERVER_BIN}..."
          go build -ldflags="${LDFLAGS}" -o "dist/${SERVER_BIN}" ./server/cmd/opennofrp-server

          VPN_BIN="opennofrp-vpn-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            VPN_BIN="${VPN_BIN}.exe"
          fi
          go build -ldflags="${LDFLAGS}" -o "dist/${VPN_BIN}" ./vpn/cmd/opennofrp-vpn
          cp vpn/internal/network/assets/WINTUN-LICENSE.txt dist/WINTUN-LICENSE.txt

          # 2. 编译 Client (Linux 使用 TPROXY/Netns 源 IP 保留；macOS 为普通转发版)
          if [ "${{ matrix.build_client }}" = "true" ]; then
            CLIENT_BIN="opennofrp-client-${{ matrix.goos }}-${{ matrix.goarch }}"
            echo "Building ${CLIENT_BIN}..."
            go build -ldflags="${LDFLAGS}" -o "dist/${CLIENT_BIN}" ./client/cmd/opennofrp-client
          fi

      - name: Archive and Package
        run: |
          cd dist
          TAG="${{ steps.vars.outputs.tag }}"
          # 将压缩包直接生成在 dist 目录下，避免创建 packages 子目录导致后续 sha256sum * 报错
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -9 "opennofrp-server-${TAG}-${{ matrix.goos }}-${{ matrix.goarch }}.zip" opennofrp-server-* opennofrp-vpn-* WINTUN-LICENSE.txt
          else
            tar -czvf "opennofrp-${TAG}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" opennofrp-* WINTUN-LICENSE.txt
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Package installers and release manifest
        run: |
          cp install/linux-{client-install,client-uninstall,server-uninstall}.sh release-assets/
          {
            printf '#!/bin/bash\n'
            cat pkg/updater/release.sh
            tail -n +2 install/linux-server-install.sh
          } > release-assets/linux-server-install.sh
          cd release-assets
          for asset in opennofrp-* linux-*.sh WINTUN-LICENSE.txt; do
            digest=$(sha256sum "$asset")
            printf '%s %s %s\n' "${digest%% *}" "$(stat -c '%s' "$asset")" "$asset"
          done > release-manifest.txt
          awk '{ print $1 "  " $3 }' release-manifest.txt > sha256sums.txt

      - name: Attest release manifest and installers
        id: attest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            release-assets/release-manifest.txt
            release-assets/linux-*.sh

      - name: Attach provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release-assets/release-attestation.jsonl

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: OpenNoFrp ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
