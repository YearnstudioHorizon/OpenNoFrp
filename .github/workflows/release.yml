name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux AMD64
          - goos: linux
            goarch: amd64
            build_client: true
          # Linux ARM64
          - goos: linux
            goarch: arm64
            build_client: true
          # Windows AMD64 (Server only)
          - goos: windows
            goarch: amd64
            build_client: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Determine Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v0.1.0-$(git rev-parse --short HEAD)"
          fi
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      - name: Build Binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          COMMIT="${{ steps.vars.outputs.commit }}"
          DATE="${{ steps.vars.outputs.date }}"
          LDFLAGS="-s -w -X 'opennofrp/pkg/version.Version=${TAG}' -X 'opennofrp/pkg/version.Commit=${COMMIT}' -X 'opennofrp/pkg/version.BuildDate=${DATE}'"

          mkdir -p dist

          # 1. 编译 Server
          SERVER_BIN="opennofrp-server-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            SERVER_BIN="${SERVER_BIN}.exe"
          fi
          echo "Building ${SERVER_BIN}..."
          go build -ldflags="${LDFLAGS}" -o "dist/${SERVER_BIN}" ./server/cmd/opennofrp-server

          # 2. 编译 Client (Linux 专享，依赖 Linux 原生 TPROXY/Netns 接口)
          if [ "${{ matrix.build_client }}" = "true" ]; then
            CLIENT_BIN="opennofrp-client-${{ matrix.goos }}-${{ matrix.goarch }}"
            echo "Building ${CLIENT_BIN}..."
            go build -ldflags="${LDFLAGS}" -o "dist/${CLIENT_BIN}" ./client/cmd/opennofrp-client
          fi

      - name: Archive and Package
        run: |
          cd dist
          TAG="${{ steps.vars.outputs.tag }}"
          # 将压缩包直接生成在 dist 目录下，避免创建 packages 子目录导致后续 sha256sum * 报错
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -9 "opennofrp-server-${TAG}-${{ matrix.goos }}-${{ matrix.goarch }}.zip" opennofrp-server-*
          else
            tar -czvf "opennofrp-${TAG}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" opennofrp-*
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          # 仅针对常规文件计算 SHA-256 校验和，忽略可能存在的子目录
          find . -maxdepth 1 -type f ! -name "sha256sums.txt" -exec sha256sum {} + | sed 's| \./| |' | sort -k 2 > sha256sums.txt
          cat sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: OpenNoFrp ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
