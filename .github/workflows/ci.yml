name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: gofmt / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l server pkg client vpn)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Shell syntax
        run: |
          for script in install/*.sh pkg/updater/release.sh; do bash -n "$script"; done

      - name: Dependency integrity and vulnerability scan
        env:
          CGO_ENABLED: "0"
        run: |
          go mod verify
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: go build
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: go vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Linux network rollback in an isolated namespace
        run: |
          go test -c -o "$RUNNER_TEMP/tproxy-test" ./client/internal/tproxy
          sudo env OPENNOFRP_TEST_NETNS=1 unshare --net "$RUNNER_TEMP/tproxy-test" -test.run '^TestRuntimeSetupAndRecoveryInNamespace$' -test.v

  windows-vpn:
    name: Windows VPN (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64, '386']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Windows VPN
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./vpn/cmd/opennofrp-vpn

  cross-build:
    name: cross build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build server and client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...
